spring:
  application:
    name: auth
  threads:
    virtual:
      enabled: true
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console  
  
  # SQL Initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  
  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: myVeryLongSecretKeyForJWTTokenSigningThatIsAtLeast256BitsLong
  access-token-expiration: 86400000  # 24 hours in milliseconds
  refresh-token-expiration: 2592000000  # 30 days in milliseconds

# Server Configuration
server:
  port: 8080

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
